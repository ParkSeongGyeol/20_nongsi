services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: nongsi-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "nongsi/health", "-m", "ping"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: nongsi-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Nongsi AutoLog API}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite:///./data/nongsi.db
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_KEEPALIVE_SECONDS: ${MQTT_KEEPALIVE_SECONDS:-60}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-nongsi-backend}
      MQTT_TOPIC: nongsi/devices/+/telemetry
      DEVICE_CONFIG_PATH: /app/config/device_thresholds.json
      DEVICE_ONLINE_TIMEOUT_SECONDS: ${DEVICE_ONLINE_TIMEOUT_SECONDS:-10}
      STATE_STREAM_POLL_SECONDS: ${STATE_STREAM_POLL_SECONDS:-0.5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/config:/app/config:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  simulator:
    build:
      context: ./simulator
    container_name: nongsi-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SIMULATOR_DEVICE_ID: ${SIMULATOR_DEVICE_ID:-sprayer-001}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-1.0}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: nongsi-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mosquitto-data:
  mosquitto-log:
